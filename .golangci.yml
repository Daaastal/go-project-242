version: "2"

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - gofumpt
    - golines

  settings:
    golines:
      max-len: 120

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - bodyclose
    - noctx
    - unused
    - revive
    - nlreturn
    - testifylint

  settings:
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: indent-error-flow
        - name: errorf
        - name: var-naming

    nlreturn:
      block-size: 2

  exclusions:
    warn-unused: true
    rules:
      - path: '_test\.go'
        linters:
          - bodyclose
          - gosec
          - noctx
