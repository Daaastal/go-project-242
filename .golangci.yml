version: "2"

formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/Daaastal/go-project-242

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - bodyclose
    - noctx
    - unused
    - revive
    - nlreturn
    - testifylint

  settings:
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008

  exclusions:
    warn-unused: true
    rules:
      - path: '_test\.go'
        linters:
          - bodyclose
          - gosec
          - noctx
